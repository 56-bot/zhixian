<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一二和布布 ♡</title>
<style>
:root{
  --pink:#FFB6C1;--light-pink:#FFE4E1;--brown:#C49A6C;--light-brown:#D4A574;
  --white:#FFF5F5;--gold:#FFD700;--cute:cubic-bezier(0.28,0.84,0.42,1);
  --shadow:0 6px 24px rgba(255,182,193,0.3);--shadow-lg:0 12px 40px rgba(255,182,193,0.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(135deg,#FFE4E1,#FFF0F5,#FFE4B5,#FFF5F5);background-size:300% 300%;animation:bgWarm 12s ease infinite}
@keyframes bgWarm{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* ---- Canvas ---- */
#petalCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ---- 浮动星光 ---- */
.sparkle{position:fixed;pointer-events:none;z-index:1;font-size:14px;animation:sparkleFloat 6s ease-in-out infinite;opacity:0;will-change:transform,opacity}
@keyframes sparkleFloat{0%,100%{opacity:0;transform:translateY(0) scale(0.5)}50%{opacity:0.6;transform:translateY(-30px) scale(1)}}

/* ---- 主结构 ---- */
.album{width:100%;height:100%;display:flex;flex-direction:column;position:relative;z-index:2}
.nav{display:flex;align-items:center;justify-content:center;padding:14px;flex-shrink:0;gap:6px}
.nav-t{font-size:20px;font-weight:800;letter-spacing:3px;color:var(--brown)}
.nav-r{display:flex;align-items:center;gap:6px;margin-left:8px}
#audioDot{font-size:10px}#bgmBtn{font-size:20px;cursor:pointer;will-change:transform}

/* ---- CSS熊猫头像 ---- */
.css-bear{width:28px;height:28px;border-radius:50% 50% 45% 45%;position:relative;display:inline-block;animation:bearWiggle 3s var(--cute) infinite;will-change:transform}
.css-bear::before,.css-bear::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;top:-6px}
.css-bear::before{left:2px}.css-bear::after{right:2px}
.css-bear .eye{position:absolute;width:4px;height:5px;background:#333;border-radius:50%;top:8px}
.css-bear .eye.l{left:7px}.css-bear .eye.r{right:7px}
.css-bear .nose{position:absolute;width:6px;height:4px;border-radius:50%;bottom:7px;left:50%;transform:translateX(-50%)}
.css-bear.yier{background:#fff;border:2px solid #e8d0d0}.css-bear.yier::before,.css-bear.yier::after{background:#333}.css-bear.yier .nose{background:#f8c0c0}
.css-bear.bubu{background:#C49A6C;border:2px solid #b8895a}.css-bear.bubu::before,.css-bear.bubu::after{background:#5a3e2b}.css-bear.bubu .nose{background:#5a3e2b}
@keyframes bearWiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}60%{transform:rotate(6deg)}}

/* 蝴蝶领结 */
.bow{display:inline-block;font-size:22px;animation:bowBounce 2s var(--cute) infinite;will-change:transform}
@keyframes bowBounce{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

.viewer{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

/* ---- 幻灯片（不规则圆角） ---- */
.slide{position:absolute;width:78vw;max-width:340px;border-radius:30px;overflow:hidden;box-shadow:var(--shadow-lg);animation:breath 4s ease-in-out infinite;display:none;will-change:transform,opacity}
.slide.show{display:block;transform:translateX(0) scale(1);opacity:1}
.slide.slide-left{display:block;transform:translateX(-130%) scale(0.82);opacity:0}
.slide.slide-right{display:block;transform:translateX(130%) scale(0.82);opacity:0}
.slide img{width:100%;display:block}
.slide .cap{position:absolute;bottom:0;left:0;right:0;padding:22px 14px;background:linear-gradient(transparent,rgba(255,245,240,0.96));text-align:center;font-size:15px;color:#8b6b5b;letter-spacing:2px;font-weight:600;line-height:2.2}
.cap .who{font-size:11px;display:inline-block;padding:2px 8px;border-radius:10px;margin-bottom:4px;letter-spacing:1px}
.cap .who.yier{background:#FFE4E1;color:#d4a0a0}
.cap .who.bubu{background:#F5E6D3;color:#b8956a}

/* 呼吸动画 */
@keyframes breath{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Q弹点击 */
.slide:active{animation:squish 0.4s var(--cute)}
@keyframes squish{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,0.94)}50%{transform:scale(0.96,1.04)}}

/* ---- 按钮星光 ---- */
.ctrl-btn{width:48px;height:48px;border-radius:50%;border:none;background:var(--white);box-shadow:var(--shadow);font-size:18px;cursor:pointer;transition:all 0.25s var(--cute);color:var(--brown);position:relative;will-change:transform}
.ctrl-btn:active{transform:scale(0.85);background:var(--light-pink)}
.ctrl-btn:active::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,182,193,0.4);transform:translate(-50%,-50%);animation:btnSparkle 0.6s ease-out}
@keyframes btnSparkle{0%{width:0;height:0;opacity:1}100%{width:120px;height:120px;opacity:0}}

.dots{display:flex;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--light-brown);transition:all 0.35s var(--cute);will-change:transform,width}
.dot.on{background:var(--pink);width:22px;border-radius:4px}

/* ---- 爱心 ---- */
.heart{position:fixed;pointer-events:none;z-index:20;font-size:28px;animation:hFly 1.6s var(--cute) forwards;will-change:transform,opacity}
@keyframes hFly{0%{opacity:0;transform:translateY(0) scale(0.2)}15%{opacity:1;transform:translateY(-35px) scale(1.3)}100%{opacity:0;transform:translateY(-160px) scale(0.5)}}

/* ---- Toast ---- */
.toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);background:rgba(200,150,120,0.9);color:#fff;padding:14px 26px;border-radius:28px;font-size:16px;z-index:30;pointer-events:none;letter-spacing:2px;animation:tAnim 2s var(--cute) forwards;backdrop-filter:blur(10px);box-shadow:var(--shadow-lg);will-change:transform,opacity}
@keyframes tAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) translateY(-35px)}}

@media(prefers-reduced-motion:reduce){.slide,.dot,.heart,.toast,.bow,.css-bear{animation:none!important;transition:none!important}}
@media(max-width:380px){.slide{width:84vw}.nav-t{font-size:16px}.cap{font-size:13px}}
@media(min-width:768px){.slide{max-width:370px}}
</style>
</head>
<body>

<canvas id="petalCanvas"></canvas>

<!-- 星光 -->
<script>
['✨','⭐','💫','🌟','♡','·','🎀'].forEach((c,i)=>{const s=document.createElement('span');s.className='sparkle';s.textContent=c;s.style.left=Math.random()*90+'%';s.style.top=Math.random()*80+'%';s.style.animationDelay=Math.random()*6+'s';s.style.animationDuration=(5+Math.random()*7)+'s';document.body.appendChild(s)});
</script>

<div class="album">
  <div class="nav">
    <div class="css-bear yier"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span></div>
    <span class="bow">🎀</span>
    <span class="nav-t">一二 & 布布</span>
    <span class="bow">🎀</span>
    <div class="css-bear bubu"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span></div>
    <div class="nav-r">
      <span id="audioDot">🔇</span><span id="bgmBtn" onclick="toggleBGM()">♪</span>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <div class="slide show"><img src="images/couple02.jpg"><div class="cap"><span class="who yier">一二</span> 我们根本是世界上<br>最好的小熊 ฅ^•ﻌ•^ฅ</div></div>
    <div class="slide"><img src="images/couple01.jpg"><div class="cap"><span class="who bubu">布布</span> 你就像礼物一样<br>出现在我的生命里 ♡</div></div>
    <div class="slide"><img src="images/couple04.jpg"><div class="cap"><span class="who yier">一二</span> 一二永远是布布<br>的小朋友 ʕ•̫͡•ʔ♡</div></div>
    <div class="slide"><img src="images/couple03.jpg"><div class="cap"><span class="who yier">一二</span> 满眼都是你呀～<br>容不下别人了 (´▽`ʃ♡ƪ)</div></div>
    <div class="slide"><img src="images/couple05.jpg"><div class="cap"><span class="who yier">一二</span> 熊家永远爱你<br>臭布布也不许跑 ╭(╯^╰)╮</div></div>
    <div class="slide"><img src="images/couple06.jpg"><div class="cap"><span class="who bubu">布布</span> 以爱之名，判你无期<br>不准上诉 (灬ºωº灬)♡</div></div>
  </div>

  <div class="ctrls">
    <button class="ctrl-btn" onclick="go(-1)">◀</button>
    <div class="dots" id="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <button class="ctrl-btn" onclick="go(1)">▶</button>
  </div>
</div>

<script>
// ===== CANVAS 心形花瓣 (GPU accelerated) =====
const cv=document.getElementById('petalCanvas'),c2d=cv.getContext('2d');
let w,h,petals=[];
function rz(){w=cv.width=innerWidth;h=cv.height=innerHeight}rz();addEventListener('resize',rz);
class P{
  constructor(){this.reset(!0)}
  reset(init){this.x=Math.random()*w;this.y=init?-50-Math.random()*120:h+40;this.s=5+Math.random()*12;this.vy=0.5+Math.random()*1.5;this.vx=-0.4+Math.random()*0.8;this.rot=Math.random()*360;this.rv=-1+Math.random()*2;this.a=0.25+Math.random()*0.4;this.c=['#FFB6C1','#FFC0CB','#FFE4E1','#FFD700','#FFE4B5'][Math.floor(Math.random()*5)]}
  upd(){this.y+=this.vy;this.x+=Math.sin(this.y*0.015)*0.5+this.vx;this.rot+=this.rv;if(this.y>h+50)this.reset(!1)}
  draw(){c2d.save();c2d.translate(this.x,this.y);c2d.rotate(this.rot*Math.PI/180);c2d.globalAlpha=this.a;c2d.fillStyle=this.c;c2d.beginPath();const s=this.s;c2d.moveTo(0,-s*.4);c2d.bezierCurveTo(s*.45,-s*.75,s*.9,-s*.2,0,s*.55);c2d.bezierCurveTo(-s*.9,-s*.2,-s*.45,-s*.75,0,-s*.4);c2d.fill();c2d.restore()}
}
for(let i=0;i<35;i++)petals.push(new P());
(function af(){c2d.clearRect(0,0,w,h);petals.forEach(p=>{p.upd();p.draw()});requestAnimationFrame(af)})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)c2d.clearRect(0,0,w,h)});

// ===== AUDIO =====
let ac=null;
function A(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,v,d,w='sine'){const c=A(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=w;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
function pop(){tone(900,.12,.08);setTimeout(()=>tone(1300,.08,.06),30)}
function loveSnd(){[523,659,784,880,1047,1318].forEach((f,i)=>setTimeout(()=>tone(f,.14,.8),i*90))}

// ===== BGM: おもちゃのチャチャチャ =====
let bgmOn=!1,bgmId=null;
const C5=523,D5=587,E5=659,F5=698,G5=784;
const MEL=[G5,G5,G5,0,E5,E5,E5,0,D5,D5,D5,0,C5,C5,C5,0,G5,G5,G5,0,E5,E5,E5,0,D5,D5,D5,0,C5,C5,C5,0,E5,E5,E5,0,D5,D5,D5,0,C5,C5,C5,0,G5,G5,G5,0,E5,E5,D5,0,C5,D5,E5,0,F5,E5,D5,0,C5,0,0,0];
const BASS=[C5,0,0,0,C5,0,0,0,G5,0,0,0,C5,0,0,0,C5,0,0,0,C5,0,0,0,G5,0,0,0,C5,0,0,0,C5,0,0,0,C5,0,0,0,G5,0,0,0,C5,0,0,0,C5,0,0,0,C5,0,0,0,G5,0,0,0,C5,0,0,0];
function bgmP(){const c=A(),t=c.currentTime,s=.12;MEL.forEach((f,i)=>{if(!f)return;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t+i*s);g.gain.setValueAtTime(0,t+i*s);g.gain.linearRampToValueAtTime(.05,t+i*s+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*s+s*.85);o.connect(g);g.connect(c.destination);o.start(t+i*s);o.stop(t+i*s+s)});BASS.forEach((f,i)=>{if(!f)return;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(f/1.5,t+i*s);g.gain.setValueAtTime(0,t+i*s);g.gain.linearRampToValueAtTime(.03,t+i*s+.03);g.gain.exponentialRampToValueAtTime(.001,t+i*s+s*2);o.connect(g);g.connect(c.destination);o.start(t+i*s);o.stop(t+i*s+s*2)})}
function sBGM(){if(bgmOn)return;A();bgmOn=!0;bgmP();bgmId=setInterval(bgmP,8200);document.getElementById('bgmBtn').textContent='🎵';document.getElementById('audioDot').textContent='🟢';document.getElementById('audioDot').style.opacity='1'}
function xBGM(){bgmOn=!1;clearInterval(bgmId);document.getElementById('bgmBtn').textContent='♪';document.getElementById('audioDot').textContent='🔇';document.getElementById('audioDot').style.opacity='0.3'}
function toggleBGM(){bgmOn?xBGM():sBGM()}
document.body.addEventListener('pointerdown',()=>{if(!bgmOn)sBGM()},{once:!0});

// ===== SLIDES =====
let cur=0,total=6,lastTap=0,anim=!1;
function go(dir){if(anim)return;let n=cur+dir;if(n<0)n=total-1;if(n>=total)n=0;if(n===cur)return;anim=!0;const ss=document.querySelectorAll('.slide');ss[cur].classList.remove('show');ss[cur].classList.add(dir>0?'slide-left':'slide-right');ss[n].classList.remove('slide-left','slide-right');ss[n].classList.add('show');cur=n;document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i===cur?' on':''));pop();setTimeout(()=>{ss.forEach(s=>s.classList.remove('slide-left','slide-right'));anim=!1},450)}

// Swipe
let sx=0;
document.getElementById('viewer').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:!0});
document.getElementById('viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(dx<-40)go(1);else if(dx>40)go(-1)},{passive:!0});

// Click hearts
document.getElementById('viewer').addEventListener('click',e=>{A();const hts=['💗','💖','💕','🩷','💝','✨','🌸','🎀','💐','💫'];for(let i=0;i<10;i++)setTimeout(()=>{const h=document.createElement('span');h.className='heart';h.textContent=hts[Math.floor(Math.random()*hts.length)];h.style.left=(e.clientX+(Math.random()-.5)*160)+'px';h.style.top=(e.clientY+(Math.random()-.5)*50)+'px';h.style.fontSize=(22+Math.random()*24)+'px';h.style.animationDuration=(1.2+Math.random()*1.2)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),1800)},i*45);pop();const n=Date.now();if(n-lastTap<500){loveSnd();bigLove();lastTap=0}else{lastTap=n}});
function bigLove(){const t=document.createElement('div');t.className='toast';t.textContent='♡ 一二 & 布布 永远在一起 ♡';document.body.appendChild(t);setTimeout(()=>t.remove(),2400);if(navigator.vibrate)navigator.vibrate([30,50,30,50,80])}

// Keyboard
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
</script>
</body>
</html>
